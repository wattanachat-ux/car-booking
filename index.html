<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เอกสารเบิกรถ Guts IOC</title>
<style>
body{font-family:Arial;background:#eef2f7;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;max-width:1400px;margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.1)}
h2{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
input,select{padding:8px;border:1px solid #ccc;border-radius:8px}
button{border:none;border-radius:8px;background:#2d6cdf;color:#fff;font-weight:bold;cursor:pointer;padding:10px}
button.red{background:#e5533d}
button.green{background:#0a8a2a}
button.gray{background:#555}
button.purple{background:#7b2cff}
.table{width:100%;border-collapse:collapse;margin-top:20px}
.table th,.table td{border:1px solid #ccc;padding:6px;text-align:center}
.status-ok{color:#0a8a2a;font-weight:bold}
.status-wait{color:#d18b00;font-weight:bold}
.status-no{color:#c10000;font-weight:bold}
.dashboard{margin-top:20px;padding:12px;background:#f5f7fb;border-radius:8px}
.busy{color:#c10000;font-weight:bold}
.summary{margin-top:10px;font-weight:bold}
.filterBox{margin-top:20px;background:#f1f3f8;padding:10px;border-radius:8px}
.pagination{margin-top:15px;text-align:center}
.pagination button{margin:2px;padding:6px 12px}
#loading{color:#2d6cdf;font-weight:bold;display:none;margin-left:10px}
</style>
</head>
<body>

<div class="card">
<h2>🚗 เอกสารเบิกรถ Guts IOC</h2>

<div class="grid">
<div><label>วันที่</label><input type="date" id="date" onchange="renderAll();lockCarDropdown()"></div>
<div><label>ทะเบียนรถ</label><select id="car"></select></div>
<div><label>โครงการ</label><input id="project"></div>
<div><label>ผู้ขับ</label><select id="driver"></select></div>
<div><label>ผู้ร่วมเดินทาง 1</label><select id="p1"></select></div>
<div><label>ผู้ร่วมเดินทาง 2</label><select id="p2"></select></div>
<div><label>เวลาเริ่ม</label><input type="time" id="start"></div>
<div><label>เวลาจบ</label><input type="time" id="end"></div>
</div>

<br>
<button onclick="saveBooking()" id="saveBtn">บันทึก</button>
<button class="green" id="exportBtn" style="display:none" onclick="exportCSV()">Export CSV</button>
<button class="red" onclick="loginAdmin()" id="loginBtn">Admin Login</button>
<button class="purple" onclick="logoutAdmin()" id="logoutBtn" style="display:none">Admin Logout</button>
<span id="loading">กำลังประมวลผล...</span>

<div class="dashboard" id="dash"></div>
<div class="summary" id="summary"></div>

<div class="filterBox">
<b>Filter</b>
<div class="grid">
<select id="filterCar"></select>
<select id="filterDriver"></select>
<input type="date" id="filterDate">
<button onclick="applyFilter()">ค้นหา</button>
</div>
</div>

<table class="table">
<thead>
<tr>
<th>วันที่</th><th>รถ</th><th>โครงการ</th><th>ผู้ขับ</th><th>ผู้ร่วมเดินทาง</th><th>เวลา</th><th>สถานะ</th><th>จัดการ</th>
<th id="thDelete" style="display:none">ลบ</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
<div class="pagination" id="page"></div>
</div>

<script>
// --- เชื่อมต่อ API ---
const API = "https://script.google.com/macros/s/AKfycbwgckQR2Ty2mZAOdi8ExG2ZWCdQyPVhhMjvjwsSt8M9ishFmMFVFWjkzuvnWfq4gj48tw/exec";

let admin=false;
let adminName="";
let bookings=[];
let filtered=[];
let page=1;
let perPage=5;

const todayStr=new Date().toISOString().split("T")[0];
document.getElementById("date").min=todayStr;

const cars=["toyota yaris 6กญ1240","toyota yaris 6กฌ9085","toyota revo 1ฒภ6727","toyota revo 2ฒข4846"];
const peopleDriver=["จิรศักดิ์","จุติมา","วัฒนะชาติ","โกเมน","อานนท์","รด","พิชชากร","สรวิศ.ก","สรวิศ.พ","ภูวดล","กฤษพล","ชยุต","เอมมิกา","ชัชโภคิณ","ณัฐพล","พัชรวรรณ"];
const peoplePassenger=["-- ไม่มีผู้ร่วมเดินทาง --",...peopleDriver];

const dateInput=document.getElementById("date");
const carInput=document.getElementById("car");
const projectInput=document.getElementById("project");
const driverSel=document.getElementById("driver");
const p1Sel=document.getElementById("p1");
const p2Sel=document.getElementById("p2");
const startInput=document.getElementById("start");
const endInput=document.getElementById("end");
const tb=document.getElementById("tb");
const dash=document.getElementById("dash");
const summary=document.getElementById("summary");
const logoutBtn=document.getElementById("logoutBtn");
const loginBtn=document.getElementById("loginBtn");
const pageDiv=document.getElementById("page");
const thDelete=document.getElementById("thDelete");
const exportBtn=document.getElementById("exportBtn");
const filterCar=document.getElementById("filterCar");
const filterDriver=document.getElementById("filterDriver");
const filterDate=document.getElementById("filterDate");

// Setup Dropdowns
cars.forEach(c=>{ carInput.add(new Option(c,c)); filterCar.add(new Option(c,c)); });
filterCar.add(new Option("ทั้งหมด",""));
peopleDriver.forEach(p=>{ driverSel.add(new Option(p,p)); filterDriver.add(new Option(p,p)); });
filterDriver.add(new Option("ทั้งหมด",""));
peoplePassenger.forEach(p=>{ p1Sel.add(new Option(p,p)); p2Sel.add(new Option(p,p)); });

// --- Helper Functions ---
function formatTime(t) {
    if (!t) return "--:--";
    let timePart = t.includes("T") ? t.split("T")[1] : t;
    return timePart.substring(0, 5);
}

function formatDate(d) {
    if (!d) return "-";
    let datePart = d.includes("T") ? d.split("T")[0] : d;
    let parts = datePart.split('-');
    return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : d;
}

// --- Data Core ---
async function loadData() {
    const res = await fetch(API);
    bookings = await res.json();
    renderAll();
    lockCarDropdown();
}

async function storeAction(url) {
    document.getElementById('loading').style.display = "inline";
    await fetch(url);
    document.getElementById('loading').style.display = "none";
    await loadData();
}

async function saveBooking(){
    const date=dateInput.value;
    if(!date || !projectInput.value || !startInput.value || !endInput.value) return alert("กรอกข้อมูลให้ครบ");
    
    const url = `${API}?action=save&id=${Date.now()}&date=${date}&car=${encodeURIComponent(carInput.value)}&project=${encodeURIComponent(projectInput.value)}&driver=${encodeURIComponent(driverSel.value)}&p1=${encodeURIComponent(p1Sel.value)}&p2=${encodeURIComponent(p2Sel.value)}&start=${startInput.value}&end=${endInput.value}`;
    await storeAction(url);
    alert("บันทึกสำเร็จ");
}

async function approve(id){
    const url = `${API}?action=updateStatus&id=${id}&status=อนุมัติ&admin=${encodeURIComponent(adminName)}`;
    await storeAction(url);
}

async function deny(id){
    const url = `${API}?action=updateStatus&id=${id}&status=ไม่อนุมัติ&admin=${encodeURIComponent(adminName)}`;
    await storeAction(url);
}

async function deleteBooking(id){
    if(!confirm("ยืนยันการลบ?")) return;
    const url = `${API}?action=delete&id=${id}`;
    await storeAction(url);
}

// --- UI Rendering ---
function renderAll(){
    filtered = bookings;
    renderTable();
    renderDashboard();
    renderSummary();
}

function renderTable(){
    let startIndex=(page-1)*perPage;
    let data=filtered.slice(startIndex,startIndex+perPage);
    let html="";

    data.forEach(b=>{
        let approveCell=b.approvedBy||"-";
        let statusClass = b.status==="อนุมัติ"?"status-ok":(b.status==="ไม่อนุมัติ"?"status-no":"status-wait");
        
        if(admin && b.status!=="อนุมัติ" && b.status!=="ไม่อนุมัติ"){
            approveCell=`<button onclick="approve('${b.id}')">อนุมัติ</button> <button onclick="deny('${b.id}')" class='red'>ไม่อนุมัติ</button>`;
        }

        html+=`<tr>
            <td>${formatDate(b.date)}</td>
            <td>${b.car}</td>
            <td>${b.project}</td>
            <td>${b.driver}</td>
            <td>${b.p1}${b.p2!=="-- ไม่มีผู้ร่วมเดินทาง --" && b.p2 ? ", "+b.p2 : ""}</td>
            <td>${formatTime(b.start)} - ${formatTime(b.end)}</td>
            <td class='${statusClass}'>${b.status||'รอ'}</td>
            <td>${approveCell}</td>
            <td style="${admin?'':'display:none'}"><button class='gray' onclick='deleteBooking("${b.id}")'>ลบ</button></td>
        </tr>`;
    });
    tb.innerHTML=html;
    renderPagination();
}

function lockCarDropdown(){
    const d=dateInput.value;
    Array.from(carInput.options).forEach(opt=>opt.disabled=false);
    bookings.forEach(b=>{ if(b.date===d && b.status==="อนุมัติ"){ Array.from(carInput.options).forEach(opt=>{ if(opt.value===b.car) opt.disabled=true; }); } });
}

function renderDashboard(){
    let d=dateInput.value;
    let html="<b>รถที่กำลังใช้งานอยู่</b><br>";
    let busyCars = bookings.filter(x=>x.date===d && x.status==="อนุมัติ").map(x=>x.car);
    dash.innerHTML = busyCars.length > 0 ? html + busyCars.map(c=>`<div class='busy'>${c}</div>`).join("") : "ไม่มีรถใช้งาน";
}

function renderSummary(){
    let d=dateInput.value;
    let count = (s) => bookings.filter(b=>b.date===d && (b.status===s || (!b.status && s==="รอ"))).length;
    summary.innerHTML=`วันนี้ อนุมัติ ${count("อนุมัติ")} | รอ ${count("รอ")} | ไม่อนุมัติ ${count("ไม่อนุมัติ")}`;
}

// --- Admin & Utils ---
function loginAdmin(){
    let pass=prompt("รหัส");
    if(pass==="11223344" || pass==="12121212"){
        admin=true; adminName=(pass==="11223344")?"จิรศักดิ์":"จุติมา";
        logoutBtn.style.display="block"; loginBtn.style.display="none"; thDelete.style.display="table-cell"; exportBtn.style.display="inline-block";
        renderAll();
    }
}

function logoutAdmin(){
    admin=false; adminName="";
    logoutBtn.style.display="none"; loginBtn.style.display="block"; thDelete.style.display="none"; exportBtn.style.display="none";
    renderAll();
}

function applyFilter(){
    filtered=bookings.filter(b=>{
        return (!filterCar.value || b.car===filterCar.value) && (!filterDriver.value || b.driver===filterDriver.value) && (!filterDate.value || b.date===filterDate.value);
    });
    page=1; renderTable();
}

function renderPagination(){
    let total=Math.ceil(filtered.length/perPage);
    if(total<=1){ pageDiv.innerHTML=""; return; }
    let html=`<button onclick="goPage(${page-1})"> < </button> หน้า ${page}/${total} <button onclick="goPage(${page+1})"> > </button>`;
    pageDiv.innerHTML=html;
}
function goPage(p){ let total=Math.ceil(filtered.length/perPage); if(p>=1 && p<=total){ page=p; renderTable(); } }

function exportCSV(){
    let csv="Date,Car,Project,Driver,P1,P2,Start,End,Status,ApprovedBy\n";
    bookings.forEach(b=> csv+=`${b.date},${b.car},${b.project},${b.driver},${b.p1},${b.p2},${b.start},${b.end},${b.status},${b.approvedBy}\n`);
    let a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv])); a.download="fleet.csv"; a.click();
}

window.onload = loadData;
</script>
</body>
</html>
