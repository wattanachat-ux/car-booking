<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เอกสารเบิกรถ Guts IOC</title>
<style>
body{font-family:Arial;background:#eef2f7;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;max-width:1400px;margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.1)}
h2{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
input,select{padding:8px;border:1px solid #ccc;border-radius:8px}
button{border:none;border-radius:8px;background:#2d6cdf;color:#fff;font-weight:bold;cursor:pointer;padding:10px}
button.red{background:#e5533d}
button.green{background:#0a8a2a}
button.purple{background:#7b2cff}
button.gray{background:#555}
.table{width:100%;border-collapse:collapse;margin-top:20px}
.table th,.table td{border:1px solid #ccc;padding:6px;text-align:center}
.badge{padding:4px 10px;border-radius:20px;color:#fff;font-size:12px}
.badge.wait{background:#d18b00}
.badge.ok{background:#0a8a2a}
.badge.no{background:#c10000}
.dashboard{margin-top:15px;font-weight:bold}
.filter{margin-top:15px}
.pagination{margin-top:15px;text-align:center}
.pagination button{margin:2px;padding:6px 12px}
</style>
</head>
<body>

<div class="card">
<h2>🚗 เอกสารเบิกรถ Guts IOC</h2>

<div class="grid">
<div><label>วันที่</label><input type="date" id="date" onchange="renderDash()"></div>
<div><label>ทะเบียนรถ</label><select id="car"></select></div>
<div><label>โครงการ</label><input id="project"></div>
<div><label>ผู้ขับ</label><select id="driver"></select></div>
<div><label>ผู้ร่วมเดินทาง 1</label><select id="p1"></select></div>
<div><label>ผู้ร่วมเดินทาง 2</label><select id="p2"></select></div>
<div><label>เวลาเริ่ม</label><input type="time" id="start"></div>
<div><label>เวลาจบ</label><input type="time" id="end"></div>
<div id="keymanBox" style="display:none"><label>ผู้จ่ายกุญแจ</label><select id="keyman"></select></div>
<div id="keystatusBox" style="display:none"><label>สถานะกุญแจ</label><select id="keystatus"><option value="">-</option><option value="เบิก">เบิก</option><option value="คืน">คืน</option></select></div>
</div>

<br>
<button onclick="saveBooking()">บันทึก</button>
<button class="green" id="exportBtn" style="display:none" onclick="exportCSV()">Export CSV</button>
<button class="red" onclick="loginAdmin()" id="loginBtn">Admin Login</button>
<button class="purple" onclick="logoutAdmin()" id="logoutBtn" style="display:none">Logout Admin</button>

<div class="dashboard" id="dash"></div>

<div class="filter">
<select id="fcar"></select>
<select id="fdriver"></select>
<input type="date" id="fdate">
<button onclick="filterData()">Filter</button>
</div>

<table class="table">
<thead>
<tr>
<th>วันที่</th><th>รถ</th><th>โครงการ</th><th>ผู้ขับ</th><th>ผู้ร่วมเดินทาง</th><th>เวลา</th><th>ผู้จ่ายกุญแจ</th><th>สถานะกุญแจ</th><th>สถานะ</th><th>อนุมัติ</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>

<div class="pagination" id="page"></div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbwgckQR2Ty2mZAOdi8ExG2ZWCdQyPVhhMjvjwsSt8M9ishFmMFVFWjkzuvnWfq4gj48tw/exec";

let bookings=[];
let viewData=[];
let admin=false;
let adminName="";
let page=1;
const perPage=5;
let tempKeyData={};

const cars=["toyota yaris 6กญ1240","toyota yaris 6กฌ9085","toyota revo 1ฒภ6727","toyota revo 2ฒข4846"];
const people=["จิรศักดิ์","จุติมา","วัฒนะชาติ","โกเมน","อานนท์","รด","พิชชากร","สรวิศ.ก","สรวิศ.พ","ภูวดล","กฤษพล","ชยุต","เอมมิกา","ชัชโภคิณ","ณัฐพล","พัชรวรรณ"];
const keymans=["จิรศักดิ์","วัฒนะชาติ","โกเมน","พิชชากร"];

const carSel=document.getElementById("car");
const driverSel=document.getElementById("driver");
const p1Sel=document.getElementById("p1");
const p2Sel=document.getElementById("p2");

const filterCar=document.getElementById("fcar") || document.getElementById("filterCar");

cars.forEach(c=>{
 carSel.add(new Option(c,c));
 if(filterCar) filterCar.add(new Option(c,c));
});
if(filterCar) filterCar.add(new Option("ทั้งหมด",""),0);

const filterDriver=document.getElementById("fdriver") || document.getElementById("filterDriver");

people.forEach(p=>{
 driverSel.add(new Option(p,p));
 if(filterDriver) filterDriver.add(new Option(p,p));
});
if(filterDriver) filterDriver.add(new Option("ทั้งหมด",""),0);

[p1Sel,p2Sel].forEach(sel=>{
 sel.add(new Option("-- ไม่มีผู้ร่วมเดินทาง --",""));
 people.forEach(p=>sel.add(new Option(p,p)));
});

const today=new Date().toISOString().split("T")[0];
document.getElementById("date").min=today;

function getDateKey(v){
 if(!v) return "";

 try{

  if(typeof v === "string"){

   if(v.includes("T")){
    return v.split("T")[0];
   }

   if(v.length >= 10 && v.includes("-")){
    return v.substring(0,10);
   }
  }

  const d = new Date(v);

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');

  return `${y}-${m}-${day}`;

 }catch(e){
  return "";
 }
}

function formatDate(v){
 if(!v) return "-";
 try{
  const d=new Date(v);
  return d.toLocaleDateString('en-GB',{timeZone:'Asia/Bangkok'});
 }catch{return "-"}
}

function formatTime(v){
 if(!v) return "--:--";
 const str=v.toString();
 if(str.includes("T")) return str.split("T")[1].substring(0,5);
 if(str.includes(":")){
  const s=str.split(":");
  return s[0].padStart(2,'0')+":"+s[1];
 }
 return "--:--";
}

async function loadData(){
 try{
  const res=await fetch(API+"?ts="+Date.now());
  bookings=await res.json();
  bookings.sort((a,b)=>Number(b.id)-Number(a.id));
  viewData=[...bookings];
  render();
  renderDash();
 }catch(e){
  console.log(e);
 }
}

function renderDash(){
 const d=document.getElementById("date").value;

 if(!d){
  document.getElementById("dash").innerHTML="";
  return;
 }

 const busyCars=[];

 cars.forEach(c=>{

  const busy=bookings.find(b=>
   getDateKey(b.date)===d &&
   b.car===c &&
   b.status==="อนุมัติ"
  );

  if(busy){
   busyCars.push(c);
  }

 });

 document.getElementById("dash").innerHTML = busyCars.length
 ? `รถที่ใช้งานอยู่: 🔴 ${busyCars.join(" 🔴 ")}`
 : "✅ รถว่างทุกคัน";
}


function render(){
 const start=(page-1)*perPage;
 const data=viewData.slice(start,start+perPage);
 let html="";

 data.forEach(b=>{

  let badge="<span class='badge wait'>รออนุมัติ</span>";
  if(b.status==="อนุมัติ") badge="<span class='badge ok'>อนุมัติ</span>";
  if(b.status==="ไม่อนุมัติ") badge="<span class='badge no'>ไม่อนุมัติ</span>";

  let approveCol=(b.approved||b.approvedBy)||"-";

  if(admin && b.status==="รออนุมัติ"){
   const duplicated=bookings.find(x=>
    x.id!==b.id &&
    getDateKey(x.date)===getDateKey(b.date) &&
    x.car===b.car &&
    x.status==="อนุมัติ"
   );

   if(duplicated){
    approveCol="❌ รถซ้ำ";
   }else{
    approveCol=`
    <button class='green' onclick='approve("${b.id}")'>อนุมัติ</button>
    <button class='red' onclick='deny("${b.id}")'>ไม่อนุมัติ</button>
    <button class='gray' onclick='deleteRow("${b.id}")'>ลบ</button>`;
   }
  }

  if(admin && b.status!=="รออนุมัติ"){
   approveCol=`${b.approved||b.approvedBy||"-"}<br><button class='gray' onclick='deleteRow("${b.id}")'>ลบ</button>`;
  }

  const passengers=((b.p1||"") + ((b.p1&&b.p2)?", ":"") + (b.p2||"")) || "ไม่มี";

  html+=`<tr>
  <td>${formatDate(b.date)}</td>
  <td>${b.car||"-"}</td>
  <td>${b.project||"-"}</td>
  <td>${b.driver||"-"}</td>
  <td>${passengers}</td>
  <td>${formatTime(b.start)} - ${formatTime(b.end)}</td>

  <td>
   ${admin ? `
   <select onchange="setTempKey('${b.id}',this.value,'keyman')">
    <option value=''>-</option>
    ${keymans.map(k=>`<option value='${k}' ${b.keyman===k?"selected":""}>${k}</option>`).join("")}
   </select>` : (b.keyman||"-")}
  </td>

  <td style='${isOverdue(b)?"background:#ffcccc":""}'>
   ${admin ? `
   <select onchange="setTempKey('${b.id}',this.value,'keystatus')">
    <option value=''>-</option>
    <option value='เบิก' ${b.keystatus==='เบิก'?"selected":""}>เบิก</option>
    <option value='คืน' ${b.keystatus==='คืน'?"selected":""}>คืน</option>
   </select>
   <button class='green' onclick="saveKey('${b.id}')">บันทึก</button>
   ` : (b.keystatus||"-")}
  </td>

  <td>${badge}</td>
  <td>${approveCol}</td>
  </tr>`;
 });

 document.getElementById("tb").innerHTML=html;
 renderPagination();
}

function renderPagination(){
 const total=Math.ceil(viewData.length/perPage);
 if(total<=1){
  page.innerHTML="";
  return;
 }

 let html=`<button onclick='prevPage()'><</button>`;
 const start=Math.max(1,page-2);
 const end=Math.min(total,page+2);

 for(let i=start;i<=end;i++){
  html+=`<button onclick='goPage(${i})' ${i===page?"style='background:#0a8a2a'":""}>${i}</button>`;
 }

 html+=`<button onclick='nextPage()'>>></button>`;
 document.getElementById("page").innerHTML=html;
}

function prevPage(){page--; if(page<1) page=1; render();}
function nextPage(){const total=Math.ceil(viewData.length/perPage); page++; if(page>total) page=total; render();}
function goPage(p){page=p; render();}

function filterData(){
 const fc=(document.getElementById("fcar") || document.getElementById("filterCar"))?.value || "";
 const fd=(document.getElementById("fdriver") || document.getElementById("filterDriver"))?.value || "";
 const fdt=(document.getElementById("fdate") || document.getElementById("filterDate"))?.value || "";

 viewData=bookings.filter(b=>
 (!fc||b.car===fc) &&
 (!fd||b.driver===fd) &&
 (!fdt||getDateKey(b.date)===fdt)
 );

 page=1;
 render();
}

function updatePeopleDropdown(){
 const d=driverSel.value;
 const p1=p1Sel.value;
 const p2=p2Sel.value;

 [driverSel,p1Sel,p2Sel].forEach(sel=>{
  Array.from(sel.options).forEach(opt=>opt.disabled=false);
 });

 [driverSel,p1Sel,p2Sel].forEach(sel=>{
  Array.from(sel.options).forEach(opt=>{
   if(opt.value && (
    (opt.value===d && sel!==driverSel) ||
    (opt.value===p1 && sel!==p1Sel) ||
    (opt.value===p2 && sel!==p2Sel)
   )){
    opt.disabled=true;
   }
  });
 });
}

[driverSel,p1Sel,p2Sel].forEach(sel=>sel.addEventListener("change",updatePeopleDropdown));

function loginAdmin(){
 const p=prompt("รหัส Admin");
 if(p==="11223344") adminName="จิรศักดิ์";
 if(p==="12121212") adminName="จุติมา";

 if(adminName){
  admin=true;
  loginBtn.style.display="none";
  logoutBtn.style.display="inline-block";
  exportBtn.style.display="inline-block";
  render();
 }
}

function logoutAdmin(){
 admin=false;
 adminName="";
 loginBtn.style.display="inline-block";
 logoutBtn.style.display="none";
 exportBtn.style.display="none";
 render();
}

async function saveBooking(){
 const d=document.getElementById("date").value;
 if(!d || d<today) return alert("ห้ามเลือกย้อนหลัง");

 const duplicated=bookings.find(b=>
  getDateKey(b.date)===d &&
  b.car===carSel.value &&
  b.status!=="ไม่อนุมัติ"
 );

 if(duplicated) return alert("รถคันนี้ถูกใช้งานแล้ว");

 const p1=p1Sel.value;
 const p2=p2Sel.value;
 const driver=driverSel.value;

 if((p1 && p1===driver)||(p2 && p2===driver)) return alert("ชื่อซ้ำผู้ขับ");
 if(p1 && p2 && p1===p2) return alert("ผู้ร่วมเดินทางซ้ำกัน");

 await fetch(`${API}?action=save&id=${Date.now()}&date=${d}&car=${encodeURIComponent(carSel.value)}&project=${encodeURIComponent(document.getElementById("project").value)}&driver=${encodeURIComponent(driver)}&p1=${encodeURIComponent(p1)}&p2=${encodeURIComponent(p2)}&start=${document.getElementById("start").value}&end=${document.getElementById("end").value}`);

 await loadData();
 alert("บันทึกสำเร็จ");
}

async function updateStatus(id,status){
 try{
  await fetch(`${API}?action=updateStatus&id=${id}&status=${status}&admin=${adminName}`);
  await loadData();
 }catch{alert("อัปเดตไม่สำเร็จ")}
}

function approve(id){updateStatus(id,"อนุมัติ")}
function deny(id){updateStatus(id,"ไม่อนุมัติ")}

async function deleteRow(id){
 if(!admin) return;
 if(!confirm("ลบรายการ ?")) return;

 try{
  await fetch(`${API}?action=delete&id=${id}`);
  await loadData();
 }catch{alert("ลบไม่สำเร็จ")}
}

function setTempKey(id,val,type){
 if(!tempKeyData[id]) tempKeyData[id]={};
 tempKeyData[id][type]=val;
}

async function saveKey(id){
 const row=bookings.find(x=>x.id==id)||{};
 const data=tempKeyData[id]||{};

 const keyman=data.keyman!==undefined ? data.keyman : (row.keyman||"");
 const keystatus=data.keystatus!==undefined ? data.keystatus : (row.keystatus||"");

 try{
  await fetch(`${API}?action=updateKey&id=${id}&keyman=${encodeURIComponent(keyman)}&keystatus=${encodeURIComponent(keystatus)}`);
  await loadData();
 }catch{alert("บันทึกกุญแจไม่สำเร็จ")}
}

function isOverdue(b){
 try{
  if(b.keystatus==="คืน") return false;
  const now=new Date();
  const end=new Date(getDateKey(b.date)+"T"+formatTime(b.end)+":00");
  return now>end;
 }catch{return false}
}

function exportCSV(){
 let csv="วันที่,รถ,โครงการ,ผู้ขับ,เวลาเริ่ม,เวลาจบ,สถานะ
";
 
 bookings.forEach(b=>{
  csv += `${formatDate(b.date)},${b.car},${b.project},${b.driver},${formatTime(b.start)},${formatTime(b.end)},${b.status}
`;
 });

 const blob = new Blob([csv],{
  type:'text/csv;charset=utf-8;'
 });

 const a = document.createElement("a");
 a.href = URL.createObjectURL(blob);
 a.download = "fleet.csv";
 a.click();
}

window.onload=()=>{
 loadData();
 updatePeopleDropdown();
 setInterval(loadData,3000);
}
</script>
</body>
</html>
