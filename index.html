<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เอกสารเบิกรถ Guts IOC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap');

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',Arial,sans-serif;background:#eef2f7;padding:20px;font-size:15px}
  .card{background:#fff;padding:24px;border-radius:14px;max-width:1400px;margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.1)}
  h2{margin-bottom:20px;color:#1a1a2e;font-size:22px}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .grid label{display:block;font-size:12px;color:#555;margin-bottom:4px;font-weight:600}
  input,select{width:100%;padding:9px 10px;border:1.5px solid #ccc;border-radius:8px;font-family:inherit;font-size:14px;transition:border .2s}
  input:focus,select:focus{outline:none;border-color:#2d6cdf}

  .btn-row{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
  button{border:none;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;padding:10px 18px;font-size:14px;transition:opacity .15s}
  button:hover{opacity:.85}
  .btn-blue{background:#2d6cdf;color:#fff}
  .btn-red{background:#e5533d;color:#fff}
  .btn-green{background:#0a8a2a;color:#fff}
  .btn-purple{background:#7b2cff;color:#fff}
  .btn-gray{background:#555;color:#fff}

  .dashboard{margin-top:18px;padding:10px 14px;background:#f0f4ff;border-radius:8px;font-weight:600;font-size:14px;color:#1a1a2e}

  .filter{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .filter select,.filter input{width:auto;min-width:140px}

  .table-wrap{overflow-x:auto;margin-top:20px}
  table{width:100%;border-collapse:collapse;min-width:900px}
  th,td{border:1px solid #ddd;padding:8px 10px;text-align:center;font-size:13px}
  th{background:#1a1a2e;color:#fff;font-weight:600}
  tr:nth-child(even){background:#f8f9fc}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;color:#fff;font-size:12px;font-weight:600}
  .badge.wait{background:#d18b00}
  .badge.ok{background:#0a8a2a}
  .badge.no{background:#c10000}

  .pagination{margin-top:14px;text-align:center}
  .pagination button{margin:2px;padding:6px 13px;font-size:13px}

  .overdue{background:#ffdddd !important}

  .spinner{text-align:center;padding:20px;color:#888;font-size:14px}
</style>
</head>
<body>

<div class="card">
  <h2>🚗 เอกสารเบิกรถ Guts IOC</h2>

  <div class="grid">
    <div><label>วันที่</label><input type="date" id="date" onchange="renderDash()"></div>
    <div><label>ทะเบียนรถ</label><select id="car"></select></div>
    <div><label>โครงการ</label><input id="project" placeholder="ชื่อโครงการ"></div>
    <div><label>ผู้ขับ</label><select id="driver"></select></div>
    <div><label>ผู้ร่วมเดินทาง 1</label><select id="p1"></select></div>
    <div><label>ผู้ร่วมเดินทาง 2</label><select id="p2"></select></div>
    <div><label>เวลาเริ่ม</label><input type="time" id="start"></div>
    <div><label>เวลาจบ</label><input type="time" id="end"></div>
    <div id="keymanBox" style="display:none"><label>ผู้จ่ายกุญแจ</label><select id="keyman"></select></div>
    <div id="keystatusBox" style="display:none"><label>สถานะกุญแจ</label><select id="keystatus"><option value="">-</option><option value="เบิก">เบิก</option><option value="คืน">คืน</option></select></div>
  </div>

  <div class="btn-row">
    <button class="btn-blue" onclick="saveBooking()">💾 บันทึก</button>
    <button class="btn-red" onclick="loginAdmin()" id="loginBtn">🔑 Admin Login</button>
    <button class="btn-purple" onclick="logoutAdmin()" id="logoutBtn" style="display:none">🚪 Logout</button>
    <button class="btn-green" id="exportBtn" style="display:none" onclick="exportCSV()">📥 Export CSV</button>
  </div>

  <div class="dashboard" id="dash">กำลังโหลด...</div>

  <div class="filter">
    <div><label style="font-size:12px;font-weight:600;color:#555">กรองรถ</label><select id="fcar"></select></div>
    <div><label style="font-size:12px;font-weight:600;color:#555">กรองผู้ขับ</label><select id="fdriver"></select></div>
    <div><label style="font-size:12px;font-weight:600;color:#555">กรองวันที่</label><input type="date" id="fdate"></div>
    <button class="btn-blue" onclick="filterData()">🔍 Filter</button>
    <button class="btn-gray" onclick="clearFilter()">✖ ล้าง</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>วันที่</th><th>รถ</th><th>โครงการ</th><th>ผู้ขับ</th>
          <th>ผู้ร่วมเดินทาง</th><th>เวลา</th><th>ผู้จ่ายกุญแจ</th>
          <th>สถานะกุญแจ</th><th>สถานะ</th><th>อนุมัติโดย</th>
        </tr>
      </thead>
      <tbody id="tb"><tr><td colspan="10" class="spinner">⏳ กำลังโหลดข้อมูล...</td></tr></tbody>
    </table>
  </div>

  <div class="pagination" id="page"></div>
</div>

<script>
// ========== CONFIG ==========
const API = "https://script.google.com/macros/s/AKfycbwgckQR2Ty2mZAOdi8ExG2ZWCdQyPVhhMjvjwsSt8M9ishFmMFVFWjkzuvnWfq4gj48tw/exec";

const cars = [
  "toyota yaris 6กญ1240",
  "toyota yaris 6กฌ9085",
  "toyota revo 1ฒภ6727",
  "toyota revo 2ฒข4846"
];

const people = [
  "จิรศักดิ์","จุติมา","วัฒนะชาติ","โกเมน","อานนท์","รด","พิชชากร",
  "ปฏิภาณ","ชุติเดช","สรวิศ.ก","สรวิศ.พ","ภูวดล","กฤษพล","ชยุต",
  "เอมมิกา","ชัชโภคิณ","ณัฐพล","พัชรวรรณ"
];

const keymanList = ["จิรศักดิ์","วัฒนะชาติ","โกเมน","พิชชากร"];

// ========== STATE ==========
let bookings = [];
let viewData = [];
let admin = false;
let adminName = "";
let page = 1;
const perPage = 10;
let autoRefreshTimer = null;

// ========== INIT DROPDOWNS ==========
const carSel       = document.getElementById("car");
const driverSel    = document.getElementById("driver");
const p1Sel        = document.getElementById("p1");
const p2Sel        = document.getElementById("p2");
const keymanSel    = document.getElementById("keyman");
const keyStatusSel = document.getElementById("keystatus");
const fcarSel      = document.getElementById("fcar");
const fdriverSel   = document.getElementById("fdriver");

cars.forEach(c => {
  carSel.add(new Option(c, c));
  fcarSel.add(new Option(c, c));
});
fcarSel.add(new Option("ทั้งหมด", ""));

[p1Sel, p2Sel].forEach(s => s.add(new Option("-- ไม่มี --", "")));
people.forEach(p => {
  driverSel.add(new Option(p, p));
  fdriverSel.add(new Option(p, p));
  [p1Sel, p2Sel].forEach(s => s.add(new Option(p, p)));
});
fdriverSel.add(new Option("ทั้งหมด", ""));

keymanList.forEach(n => keymanSel.add(new Option(n, n)));

// ========== DATE (Bangkok timezone) ==========
// ✅ แก้ข้อ 3: today ใช้ Bangkok timezone ไม่ใช่ UTC
const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
document.getElementById("date").min = today;

// ========== HELPERS ==========
function getDateKey(val) {
  if (!val) return "";
  try {
    const d = new Date(val);
    return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
  } catch(e) { return ""; }
}

function formatDate(d) {
  if (!d) return "-";
  try {
    const dt = new Date(d);
    const parts = dt.toLocaleDateString('en-GB', { timeZone: 'Asia/Bangkok' }).split('/');
    return `${parts[0]}/${parts[1]}/${parts[2]}`;
  } catch(e) { return "-"; }
}

function formatTime(t) {
  if (!t) return "--:--";
  const str = t.toString();
  if (str.includes("T")) return str.split("T")[1].substring(0, 5);
  if (str.includes(":")) {
    const sp = str.split(":");
    return sp[0].padStart(2, '0') + ":" + sp[1];
  }
  return "--:--";
}

function isOverdue(b) {
  try {
    if (!b.keystatus || b.keystatus === "คืน") return false;
    const endTime = formatTime(b.end);
    if (endTime === "--:--") return false;
    const endDt = new Date(getDateKey(b.date) + "T" + endTime + ":00");
    return new Date() > endDt;
  } catch(e) { return false; }
}

// ========== LOAD DATA ==========
async function loadData() {
  try {
    const res = await fetch(API + "?ts=" + Date.now());
    const txt = await res.text();
    bookings = JSON.parse(txt);
    bookings.sort((a, b) => Number(b.id) - Number(a.id));
  } catch(e) {
    document.getElementById("tb").innerHTML = '<tr><td colspan="10" style="color:red">⚠️ โหลดข้อมูลไม่ได้ กรุณา refresh</td></tr>';
    return;
  }
  // คงสภาพ filter ปัจจุบัน
  filterData(false);
  renderDash();
}

// ✅ แก้ข้อ 4: refresh ทุก 20 วินาที (จากเดิม 3 วินาที)
function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(loadData, 20000);
}

// ========== DASHBOARD ==========
function renderDash() {
  const d = document.getElementById("date").value;
  if (!d) { document.getElementById("dash").innerHTML = "📅 เลือกวันที่เพื่อดูสถานะรถ"; return; }
  let html = "📊 สถานะรถวันที่ " + formatDate(d + "T00:00:00") + " → ";
  let found = false;
  cars.forEach(c => {
    const busy = bookings.find(b => getDateKey(b.date) === d && b.car === c && b.status === "อนุมัติ");
    if (busy) { html += ` 🔴 ${c} `; found = true; }
  });
  if (!found) html += " ✅ รถว่างทุกคัน";
  document.getElementById("dash").innerHTML = html;
}

// ========== RENDER TABLE ==========
function render() {
  const start = (page - 1) * perPage;
  const data = viewData.slice(start, start + perPage);
  let html = "";

  if (data.length === 0) {
    html = '<tr><td colspan="10" style="color:#888;padding:20px">ไม่มีข้อมูล</td></tr>';
  }

  data.forEach(b => {
    let badge = "<span class='badge wait'>รออนุมัติ</span>";
    if (b.status === "อนุมัติ")    badge = "<span class='badge ok'>อนุมัติ</span>";
    if (b.status === "ไม่อนุมัติ") badge = "<span class='badge no'>ไม่อนุมัติ</span>";

    let actionCell = b.approved || b.approvedby
      ? `<span style='color:#0a8a2a;font-weight:bold'>${b.approved || b.approvedby}</span>`
      : "-";

    if (admin) {
      if (b.status === "รออนุมัติ") {
        const alreadyApproved = bookings.find(x =>
          getDateKey(x.date) === getDateKey(b.date) && x.car === b.car && x.status === "อนุมัติ"
        );
        if (alreadyApproved) {
          actionCell = "<span style='color:#c10000'>❌ มีคันนี้อนุมัติแล้ว</span>";
        } else {
          actionCell = `
            <button class="btn-green" onclick="approve('${b.id}')">✔ อนุมัติ</button>
            <button class="btn-red" onclick="deny('${b.id}')">✖ ไม่อนุมัติ</button>
            <button class="btn-gray" onclick="deleteRow('${b.id}')">🗑 ลบ</button>`;
        }
      } else {
        actionCell = `<button class="btn-gray" onclick="deleteRow('${b.id}')">🗑 ลบ</button>`;
      }
    }

    const companions = [b.p1, b.p2].filter(x => x && x !== "").join(", ") || "ไม่มี";
    const overdueClass = isOverdue(b) ? " class='overdue'" : "";

    html += `<tr>
      <td>${formatDate(b.date)}</td>
      <td>${b.car || "-"}</td>
      <td>${b.project || "-"}</td>
      <td>${b.driver || "-"}</td>
      <td>${companions}</td>
      <td>${formatTime(b.start)} - ${formatTime(b.end)}</td>
      <td>${b.keyman || "-"}</td>
      <td${overdueClass}>${b.keystatus || "-"}</td>
      <td>${badge}</td>
      <td>${actionCell}</td>
    </tr>`;
  });

  document.getElementById("tb").innerHTML = html;
  renderPagination();
}

// ========== PAGINATION ==========
function renderPagination() {
  const total = Math.ceil(viewData.length / perPage);
  if (total <= 1) { document.getElementById("page").innerHTML = ""; return; }
  let html = `<button class="btn-gray" onclick="prevPage()">◀</button> `;
  for (let i = 1; i <= total; i++) {
    const active = i === page ? 'style="background:#0a8a2a;color:#fff"' : '';
    html += `<button ${active} onclick="goPage(${i})">${i}</button> `;
  }
  html += `<button class="btn-gray" onclick="nextPage()">▶</button>`;
  document.getElementById("page").innerHTML = html;
}

function prevPage() { if (page > 1) { page--; render(); } }
function nextPage() { const t = Math.ceil(viewData.length / perPage); if (page < t) { page++; render(); } }
function goPage(p) { page = p; render(); }

// ========== FILTER ==========
function filterData(resetPage = true) {
  const fc  = fcarSel.value;
  const fd  = fdriverSel.value;
  const fdt = document.getElementById("fdate").value;
  viewData = bookings.filter(b => {
    return (!fc || b.car === fc) &&
           (!fd || b.driver === fd) &&
           (!fdt || getDateKey(b.date) === fdt);
  });
  if (resetPage) page = 1;
  if (page > Math.ceil(viewData.length / perPage)) page = 1;
  render();
}

function clearFilter() {
  fcarSel.value = "";
  fdriverSel.value = "";
  document.getElementById("fdate").value = "";
  filterData();
}

// ========== ADMIN LOGIN / LOGOUT ==========
// ✅ แก้ข้อ 1: ส่ง password ไป verify ที่ Apps Script แทนเขียนใน code
async function loginAdmin() {
  const p = prompt("กรอกรหัส Admin:");
  if (!p) return;
  try {
    const res = await fetch(`${API}?action=login&pwd=${encodeURIComponent(p)}&ts=${Date.now()}`);
    const data = await res.json();
    if (data.ok) {
      admin = true;
      adminName = data.name;
      document.getElementById("loginBtn").style.display   = "none";
      document.getElementById("logoutBtn").style.display  = "inline-block";
      document.getElementById("exportBtn").style.display  = "inline-block";
      document.getElementById("keymanBox").style.display  = "block";
      document.getElementById("keystatusBox").style.display = "block";
      render();
    } else {
      alert("❌ รหัสผิด กรุณาลองใหม่");
    }
  } catch(e) {
    alert("⚠️ เชื่อมต่อ server ไม่ได้");
  }
}

function logoutAdmin() {
  admin = false; adminName = "";
  document.getElementById("loginBtn").style.display   = "inline-block";
  document.getElementById("logoutBtn").style.display  = "none";
  document.getElementById("exportBtn").style.display  = "none";
  document.getElementById("keymanBox").style.display  = "none";
  document.getElementById("keystatusBox").style.display = "none";
  render();
}

// ========== SAVE BOOKING ==========
// ✅ แก้ข้อ 2: validate เวลา + ข้อ 5: try/catch + ข้อ 6: URLSearchParams (encode อัตโนมัติ)
async function saveBooking() {
  const d        = document.getElementById("date").value;
  const startVal = document.getElementById("start").value;
  const endVal   = document.getElementById("end").value;
  const driver   = driverSel.value;
  const p1       = p1Sel.value;
  const p2       = p2Sel.value;

  // Validate
  if (!d)          return alert("⚠️ กรุณาเลือกวันที่");
  if (d < today)   return alert("⚠️ ห้ามเลือกวันย้อนหลัง");
  if (!driver)     return alert("⚠️ กรุณาเลือกผู้ขับ");
  if (!startVal)   return alert("⚠️ กรุณากรอกเวลาเริ่ม");
  if (!endVal)     return alert("⚠️ กรุณากรอกเวลาจบ");
  if (endVal <= startVal) return alert("⚠️ เวลาจบต้องมากกว่าเวลาเริ่ม");
  if ((p1 && p1 === driver) || (p2 && p2 === driver)) return alert("⚠️ ผู้ขับห้ามซ้ำกับผู้ร่วมเดินทาง");
  if (p1 && p2 && p1 === p2) return alert("⚠️ ผู้ร่วมเดินทางห้ามซ้ำกัน");

  const isReturn = keyStatusSel.value === "คืน";
  const returnTs = isReturn ? new Date().toISOString() : "";

  // ✅ ข้อ 6: URLSearchParams จัดการ encode ให้อัตโนมัติ ไม่พัง แม้มีช่องว่างหรืออักขระพิเศษ
  const params = new URLSearchParams({
    action:    "save",
    id:        Date.now().toString(),
    date:      d,
    car:       carSel.value,
    project:   document.getElementById("project").value,
    driver:    driver,
    p1:        p1,
    p2:        p2,
    start:     startVal,
    end:       endVal,
    keyman:    keymanSel.value || "",
    keystatus: keyStatusSel.value || "",
    return_ts: returnTs
  });

  // ✅ ข้อ 5: try/catch ครอบทุก fetch
  try {
    const res = await fetch(`${API}?${params.toString()}`);
    const txt = await res.text();
    if (txt === "Saved") {
      await loadData();
      alert("✅ บันทึกสำเร็จ");
    } else {
      alert("⚠️ บันทึกไม่สำเร็จ กรุณาลองใหม่");
    }
  } catch(e) {
    alert("⚠️ เชื่อมต่อ server ไม่ได้ กรุณาลองใหม่");
  }
}

// ========== APPROVE / DENY / DELETE ==========
function approve(id) { updateStatus(id, "อนุมัติ"); }
function deny(id)    { updateStatus(id, "ไม่อนุมัติ"); }

async function updateStatus(id, status) {
  try {
    await fetch(`${API}?action=updateStatus&id=${id}&status=${encodeURIComponent(status)}&admin=${encodeURIComponent(adminName)}`);
    await loadData();
  } catch(e) {
    alert("⚠️ อัปเดตสถานะไม่สำเร็จ");
  }
}

async function deleteRow(id) {
  if (!admin) return alert("เฉพาะ Admin เท่านั้น");
  if (!confirm("ต้องการลบรายการนี้ใช่ไหม?")) return;
  try {
    await fetch(`${API}?action=delete&id=${id}&ts=${Date.now()}`);
    await loadData();
  } catch(e) {
    alert("⚠️ ลบไม่สำเร็จ");
  }
}

// ========== EXPORT CSV ==========
// ✅ เพิ่ม BOM (\uFEFF) แก้ Excel เปิดแล้วภาษาไทยแตก
function exportCSV() {
  let csv = "\uFEFF" + "วันที่,รถ,โครงการ,ผู้ขับ,ผู้ร่วม1,ผู้ร่วม2,เวลาเริ่ม,เวลาจบ,สถานะ,อนุมัติโดย\n";
  bookings.forEach(b => {
    csv += [
      formatDate(b.date), b.car, b.project, b.driver,
      b.p1 || "", b.p2 || "",
      formatTime(b.start), formatTime(b.end),
      b.status, b.approved || b.approvedby || ""
    ].join(",") + "\n";
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fleet_" + today + ".csv";
  a.click();
}

// ========== PREVENT DUPLICATE SELECTION ==========
function updatePeopleDropdown() {
  const driver = driverSel.value;
  const p1 = p1Sel.value;
  const p2 = p2Sel.value;
  [driverSel, p1Sel, p2Sel].forEach(sel => {
    Array.from(sel.options).forEach(opt => {
      opt.disabled = false;
      if (!opt.value) return;
      if (sel !== driverSel && opt.value === driver) opt.disabled = true;
      if (sel !== p1Sel    && opt.value === p1 && p1) opt.disabled = true;
      if (sel !== p2Sel    && opt.value === p2 && p2) opt.disabled = true;
    });
  });
}

[driverSel, p1Sel, p2Sel].forEach(sel => sel.addEventListener("change", updatePeopleDropdown));

// ========== START ==========
window.onload = () => {
  loadData();
  updatePeopleDropdown();
  startAutoRefresh();
};
</script>
</body>
</html>
