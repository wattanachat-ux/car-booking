<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เอกสารเบิกรถ Guts IOC</title>
<style>
    body{font-family:Arial;background:#eef2f7;padding:20px}
    .card{background:#fff;padding:20px;border-radius:12px;max-width:1400px;margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.1)}
    .grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
    input,select{padding:8px;border:1px solid #ccc;border-radius:8px;width:90%}
    button{border:none;border-radius:8px;background:#2d6cdf;color:#fff;font-weight:bold;cursor:pointer;padding:10px;margin-right:5px}
    button.red{background:#e5533d}
    button.green{background:#0a8a2a}
    button.purple{background:#7b2cff}
    .table{width:100%;border-collapse:collapse;margin-top:20px;background:#fff}
    .table th,.table td{border:1px solid #ccc;padding:8px;text-align:center}
    .status-ok{color:#0a8a2a;font-weight:bold}
    .status-wait{color:#d18b00;font-weight:bold}
    .status-no{color:#c10000;font-weight:bold}
    .dashboard{margin-top:20px;padding:12px;background:#f5f7fb;border-radius:8px}
    .busy{color:#c10000;font-weight:bold}
    #loading{color:#2d6cdf;font-weight:bold;display:none;margin-left:10px}
    .summary{margin-top:10px;font-weight:bold}
    .filterBox{margin-top:20px;background:#f1f3f8;padding:15px;border-radius:8px}
    .pagination{margin-top:15px;text-align:center}
    .pagination button{margin:2px;padding:6px 12px;background:#fff;color:#2d6cdf;border:1px solid #2d6cdf}
</style>
</head>
<body>

<div class="card">
    <h2>🚗 เอกสารเบิกรถ Guts IOC</h2>
    <div class="grid">
        <div><label>วันที่</label><br><input type="date" id="date" onchange="lockCarDropdown();renderDashboard();renderSummary()"></div>
        <div><label>ทะเบียนรถ</label><br><select id="car"></select></div>
        <div><label>โครงการ</label><br><input id="project" placeholder="ระบุชื่อโครงการ"></div>
        <div><label>ผู้ขับ</label><br><select id="driver"></select></div>
        <div><label>ผู้ร่วมเดินทาง 1</label><br><select id="p1"></select></div>
        <div><label>ผู้ร่วมเดินทาง 2</label><br><select id="p2"></select></div>
        <div><label>เวลาเริ่ม</label><br><input type="time" id="start"></div>
        <div><label>เวลาจบ</label><br><input type="time" id="end"></div>
    </div>
    <br>
    <button onclick="saveBooking()" id="saveBtn">บันทึกการจอง</button>
    <button class="green" id="exportBtn" style="display:none" onclick="exportCSV()">Export CSV</button>
    <button class="red" onclick="loginAdmin()" id="loginBtn">Admin Login</button>
    <button class="purple" onclick="logoutAdmin()" id="logoutBtn" style="display:none">Admin Logout</button>
    <span id="loading">⌛ กำลังประมวลผล...</span>

    <div class="dashboard" id="dash"></div>
    <div class="summary" id="summary"></div>

    <div class="filterBox">
        <b>🔍 ค้นหาและคัดกรองข้อมูล</b>
        <div class="grid">
            <select id="filterCar"></select>
            <select id="filterDriver"></select>
            <input type="date" id="filterDate">
            <button onclick="applyFilter()">ค้นหา</button>
            <button onclick="location.reload()" style="background:#888">ล้างค่า</button>
        </div>
    </div>

    <table class="table">
        <thead>
            <tr><th>วันที่</th><th>รถ</th><th>โครงการ</th><th>ผู้ขับ</th><th>ผู้ร่วมเดินทาง</th><th>เวลา</th><th>สถานะ</th><th>ผู้อนุมัติ</th></tr>
        </thead>
        <tbody id="tb"></tbody>
    </table>
    <div class="pagination" id="page"></div>
</div>

<script>
const API = "YOUR_API_URL_HERE"; // *** วาง URL ของคุณที่นี่ ***

let admin=false; let adminName=""; let bookings=[]; let filtered=[]; let page=1; let perPage=10;

const todayStr = new Date().toISOString().split("T")[0];
document.getElementById("date").min = todayStr;

const cars=["toyota yaris 6กญ1240","toyota yaris 6กฌ9085","toyota revo 1ฒภ6727","toyota revo 2ฒข4846"];
const people=["จิรศักดิ์","จุติมา","วัฒนะชาติ","โกเมน","อานนท์","รด","พิชชากร","สรวิศ.ก","สรวิศ.พ","ภูวดล","กฤษพล","ชยุต","เอมมิกา","ชัชโภคิณ","ณัฐพล","พัชรวรรณ"];

const carSel=document.getElementById('car');
const driverSel=document.getElementById('driver');
const p1Sel=document.getElementById('p1');
const p2Sel=document.getElementById('p2');

cars.forEach(c=>{ carSel.add(new Option(c,c)); document.getElementById('filterCar').add(new Option(c,c)); });
document.getElementById('filterCar').add(new Option("รถทั้งหมด",""),0);
people.forEach(p=>{ 
    driverSel.add(new Option(p,p)); 
    document.getElementById('filterDriver').add(new Option(p,p));
    p1Sel.add(new Option(p,p));
    p2Sel.add(new Option(p,p));
});
p1Sel.add(new Option("-- ไม่มีผู้ร่วมเดินทาง --",""),0); p1Sel.selectedIndex=0;
p2Sel.add(new Option("-- ไม่มีผู้ร่วมเดินทาง --",""),0); p2Sel.selectedIndex=0;
document.getElementById('filterDriver').add(new Option("คนขับทั้งหมด",""),0);

// ฟังก์ชันล้างค่าวันที่/เวลาที่เพี้ยน
function formatDisplayDate(val) {
    if(!val) return "-";
    let s = val.toString();
    if(s.includes('T')) return s.split('T')[0].split('-').reverse().join('/');
    return s;
}

function formatDisplayTime(val) {
    if(!val) return "--:--";
    let s = val.toString();
    // ถ้ามีวันที่ 1899 หรือ ISO ติดมา ให้ดึงเอาแค่เลขเวลา 00:00
    let match = s.match(/(\d{1,2}:\d{2})/);
    return match ? match[1] : s;
}

async function loadData() {
    document.getElementById('loading').style.display="inline";
    try {
        const res = await fetch(API);
        bookings = await res.json();
        renderAll();
    } catch(e) { alert("เกิดข้อผิดพลาดในการดึงข้อมูล"); }
    document.getElementById('loading').style.display="none";
}

function lockCarDropdown() {
    const d = document.getElementById('date').value;
    Array.from(carSel.options).forEach(opt => {
        const isBusy = bookings.some(b => b.date && b.date.includes(d) && b.car === opt.value && b.status === "อนุมัติ");
        opt.disabled = isBusy;
    });
}

async function saveBooking() {
    const d = document.getElementById('date').value;
    const st = document.getElementById('start').value;
    const en = document.getElementById('end').value;
    if(!d || !st || !en) return alert("กรุณาระบุ วันที่ และ เวลาให้ครบถ้วน!");
    if(d < todayStr) return alert("ห้ามเลือกวันย้อนหลัง!");
    
    document.getElementById('loading').style.display="inline";
    const url = `${API}?action=save&id=${Date.now()}&date=${d}&car=${encodeURIComponent(carSel.value)}&project=${encodeURIComponent(document.getElementById('project').value)}&driver=${encodeURIComponent(driverSel.value)}&p1=${encodeURIComponent(p1Sel.value)}&p2=${encodeURIComponent(p2Sel.value)}&start=${st}&end=${en}`;
    await fetch(url);
    document.getElementById('loading').style.display="none";
    alert("ส่งคำขอจองรถแล้ว รอการอนุมัติ");
    location.reload();
}

async function updateStatus(id, status) {
    document.getElementById('loading').style.display="inline";
    const url = `${API}?action=updateStatus&id=${id}&status=${encodeURIComponent(status)}&admin=${encodeURIComponent(adminName)}`;
    await fetch(url);
    loadData();
}

function renderAll() {
    filtered = bookings;
    renderTable();
    renderDashboard();
    renderSummary();
    lockCarDropdown();
}

function renderTable() {
    let start=(page-1)*perPage;
    let data=filtered.slice(start, start+perPage);
    let html="";
    data.forEach(b => {
        let s = b.status || "รออนุมัติ";
        let sClass = s === "อนุมัติ" ? "status-ok" : (s === "ไม่อนุมัติ" ? "status-no" : "status-wait");
        
        let p1 = (b.p1 && b.p1.includes("ไม่มี") === false) ? b.p1 : "";
        let p2 = (b.p2 && b.p2.includes("ไม่มี") === false) ? b.p2 : "";
        let pDisplay = (p1 || p2) ? (p1 + (p1 && p2 ? ", " : "") + p2) : "ไม่มีผู้ร่วมเดินทาง";
        
        let action = "";
        if (admin && (s === "รออนุมัติ" || s === "รอ")) {
            action = `<button class="green" onclick="updateStatus('${b.id}','อนุมัติ')">อนุมัติ</button> 
                      <button class="red" onclick="updateStatus('${b.id}','ไม่อนุมัติ')">ปฏิเสธ</button>`;
        } else {
            action = b.approvedBy ? `<b>✅ ${b.approvedBy}</b>` : "-";
        }

        html += `<tr>
            <td>${formatDisplayDate(b.date)}</td>
            <td>${b.car}</td>
            <td style="text-align:left">${b.project || "-"}</td>
            <td>${b.driver}</td>
            <td>${pDisplay}</td>
            <td>${formatDisplayTime(b.start)} - ${formatDisplayTime(b.end)}</td>
            <td class="${sClass}">${s}</td>
            <td>${action}</td>
        </tr>`;
    });
    document.getElementById('tb').innerHTML = html;
    renderPagination();
}

function renderDashboard() {
    const d = document.getElementById('date').value;
    if(!d) { document.getElementById('dash').innerHTML = "💡 กรุณาเลือกวันที่เพื่อเช็คสถานะรถว่าง"; return; }
    const busy = bookings.filter(b => b.date && b.date.includes(d) && b.status === "อนุมัติ").map(b => b.car);
    document.getElementById('dash').innerHTML = busy.length ? `🚫 รถที่ไม่ว่างวันนี้: <span class="busy">${busy.join(", ")}</span>` : "✅ รถว่างทุกคันในวันที่เลือก";
}

function renderSummary() {
    const d = document.getElementById('date').value || todayStr;
    const count = (s) => bookings.filter(b => b.date && b.date.includes(d) && b.status === s).length;
    document.getElementById('summary').innerHTML = `📊 สรุปรายการ (${formatDisplayDate(d)}): อนุมัติ ${count("อนุมัติ")} | ปฏิเสธ ${count("ไม่อนุมัติ")}`;
}

function applyFilter() {
    const fc = document.getElementById('filterCar').value;
    const fd = document.getElementById('filterDriver').value;
    const fdt = document.getElementById('filterDate').value;
    filtered = bookings.filter(b => (!fc || b.car === fc) && (!fd || b.driver === fd) && (!fdt || (b.date && b.date.includes(fdt))));
    page = 1; renderTable();
}

function loginAdmin() {
    let p = prompt("กรุณาระบุรหัสผ่าน Admin:");
    if(p === "11223344" || p === "12121212") {
        admin = true; 
        adminName = (p === "11223344") ? "จิรศักดิ์" : "จุติมา";
        document.getElementById('loginBtn').style.display="none";
        document.getElementById('logoutBtn').style.display="inline-block";
        document.getElementById('exportBtn').style.display="inline-block";
        renderTable();
    } else if(p !== null) { alert("รหัสผ่านไม่ถูกต้อง!"); }
}

function logoutAdmin() { admin=false; location.reload(); }

function renderPagination() {
    let total = Math.ceil(filtered.length / perPage);
    document.getElementById('page').innerHTML = total > 1 ? `<button onclick="goPage(${page-1})">ก่อนหน้า</button> [ หน้า ${page} / ${total} ] <button onclick="goPage(${page+1})">ถัดไป</button>` : "";
}

function goPage(p) { if(p > 0 && p <= Math.ceil(filtered.length/perPage)) { page = p; renderTable(); } }

function exportCSV() {
    let csv = "\uFEFFวันที่,รถ,โครงการ,ผู้ขับ,ผู้ร่วมเดินทาง,เริ่ม,จบ,สถานะ,ผู้อนุมัติ\n";
    filtered.forEach(b => {
        csv += `${formatDisplayDate(b.date)},${b.car},"${b.project}",${b.driver},"${b.p1} ${b.p2}",${formatDisplayTime(b.start)},${formatDisplayTime(b.end)},${b.status},${b.approvedBy}\n`;
    });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    link.download = "Report_Booking.csv";
    link.click();
}

window.onload = loadData;
</script>
</body>
</html>
